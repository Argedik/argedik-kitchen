<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seyir Mutfak</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<style>
:root {
  --zemin: #fbf8f3;
  --murekkep: #26201a;
  --soluk: #75685a;
  --cizgi: #e6ddd0;
  --serit: #f3ede4;
  --vurgu: #b44d1b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #1b1814;
    --murekkep: #efe7dc;
    --soluk: #a8998a;
    --cizgi: #3a322a;
    --serit: #25201b;
    --vurgu: #ec8a55;
  }
}
:root[data-theme="dark"] {
  --zemin: #1b1814;
  --murekkep: #efe7dc;
  --soluk: #a8998a;
  --cizgi: #3a322a;
  --serit: #25201b;
  --vurgu: #ec8a55;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto; max-width: 680px; padding: 8px 12px 24px;
  background: var(--zemin); color: var(--murekkep);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
h1 { font-size: 20px; line-height: 1.25; margin: 4px 0 2px; }
h2 { font-size: 16px; margin: 16px 0 4px; padding-bottom: 2px; border-bottom: 2px solid var(--vurgu); }
p { margin: 0; }
.bilgi { color: var(--soluk); font-size: 13.5px; }
.notlar { margin: 8px 0 0; padding: 0 0 0 16px; font-size: 13.5px; color: var(--soluk); }
.notlar li { margin: 2px 0; }

table { width: 100%; border-collapse: collapse; }
td, th { padding: 3px 4px; vertical-align: top; text-align: left; border-bottom: 1px solid var(--cizgi); }
th { font-size: 12px; font-weight: 700; color: var(--soluk); }
.grup td { background: var(--serit); font-weight: 700; font-size: 13px; }
.miktar { white-space: nowrap; font-weight: 600; width: 1%; padding-right: 10px; }
.malz .miktar { white-space: normal; width: 40%; }

.adimlar { margin: 0; padding: 0; list-style: none; }
.adim { padding: 6px 0; border-bottom: 1px solid var(--cizgi); }
.adim-bas { font-weight: 700; }
.adim-bas .sure { font-weight: 600; color: var(--vurgu); font-size: 13px; margin-left: 4px; }
.ipucu { color: var(--soluk); font-size: 13.5px; }
.kullan { font-size: 13.5px; margin-top: 2px; }
.eylemler { margin-top: 2px; }
.eylemler td { border: 0; padding: 1px 4px 1px 0; }
.eylemler .miktar { color: var(--vurgu); font-weight: 600; font-size: 13.5px; }
.bos { color: var(--soluk); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main id="ana"><p class="bos">yükleniyor…</p></main>
<script>
const kacis = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function sureYaz(sn) {
  const dk = Math.floor(sn / 60), s = sn % 60;
  return dk && s ? `${dk} dk ${s} sn` : dk ? `${dk} dk` : `${s} sn`;
}

// Zaman çizelgesi grubu: miktar sütunu dakika ise ("0. dk", "25–35. dk").
const cizelgeMi = (g) => g.tur === "liste" && g.ogeler.every((o) => /dk$/.test(o.miktar));

// "### Baharatlar" grupları bütün bölümlerden toplanır: tabloda tek grup, adımlarda 🧂 satırı.
const baharatGrubu = (g) => g.tur === "liste" && g.baslik === "Baharatlar";
const yalin = (ad) => ad.replace(/\(.*?\)/g, "").trim().toLocaleLowerCase("tr");
let baharatlar = new Set();

const satir = (o) => `<tr><td class="miktar">${kacis(o.miktar)}</td><td>${kacis(o.ad)}</td></tr>`;
const grupSatiri = (ad) => `<tr class="grup"><td colspan="2">${kacis(ad)}</td></tr>`;

// Bütün bölümlerin malzemeleri tek tabloda, bölüm adı ara satır olarak; baharatlar en sonda tek grup.
function malzemeTablosu(t) {
  const satirlar = t.bolumler.flatMap((b) => {
    const ogeler = b.gruplar.filter((g) => g.tur === "liste" && !cizelgeMi(g) && !baharatGrubu(g)).flatMap((g) => g.ogeler);
    return ogeler.length ? [grupSatiri(b.baslik), ...ogeler.map(satir)] : [];
  });
  const baharat = t.bolumler.flatMap((b) => b.gruplar.filter(baharatGrubu).flatMap((g) => g.ogeler));
  if (baharat.length) satirlar.push(grupSatiri("🧂 Baharatlar"), ...baharat.map(satir));
  return satirlar.length ? `<h2>Malzemeler</h2><table class="malz">${satirlar.join("")}</table>` : "";
}

function kullanilacaklar(a) {
  const liste = (ms) => ms.map((m) => `${kacis(m.miktar)} ${kacis(m.ad)}`).join(" · ");
  const bah = a.malzemeler.filter((m) => baharatlar.has(yalin(m.ad)));
  const diger = a.malzemeler.filter((m) => !baharatlar.has(yalin(m.ad)));
  return (diger.length ? `<p class="kullan">🥘 ${liste(diger)}</p>` : "") +
    (bah.length ? `<p class="kullan">🧂 ${liste(bah)}</p>` : "");
}

function adimlar(b) {
  return b.gruplar.filter((g) => g.tur === "adim").map((g) => `
    <h2>${kacis(b.baslik)}</h2>
    <ol class="adimlar">${g.ogeler.map((a, i) => `
      <li class="adim">
        <p class="adim-bas">${i + 1}. ${kacis(a.baslik)}${a.saniye ? `<span class="sure">${sureYaz(a.saniye)}</span>` : ""}</p>
        ${a.metin ? `<p class="ipucu">${kacis(a.metin)}</p>` : ""}
        ${kullanilacaklar(a)}
        ${a.eylemler.length ? `<table class="eylemler">${a.eylemler.map((e) =>
          `<tr><td class="miktar">${sureYaz(e.saniye)}</td><td>${kacis(e.metin)}</td></tr>`).join("")}</table>` : ""}
      </li>`).join("")}
    </ol>`).join("");
}

function cizelge(b) {
  return b.gruplar.filter(cizelgeMi).map((g) => `
    <h2>${kacis(b.baslik)}</h2>
    <table><tr><th>Dakika</th><th>Yapılacak</th></tr>
      ${g.ogeler.map((o) => `<tr><td class="miktar">${kacis(o.miktar)}</td><td>${kacis(o.ad)}</td></tr>`).join("")}
    </table>`).join("");
}

function tarif(t) {
  baharatlar = new Set(t.bolumler.flatMap((b) => b.gruplar.filter(baharatGrubu).flatMap((g) => g.ogeler.map((o) => yalin(o.ad)))));
  const notlar = t.bolumler.flatMap((b) => b.notlar.filter(Boolean));
  return `<article>
    <h1>${kacis(t.emoji)} ${kacis(t.baslik)}</h1>
    <p class="bilgi">${[t.kisi && `${t.kisi} kişilik`, t.sure && `~${t.sure} dk`, t.kod].filter(Boolean).map(kacis).join(" · ")}</p>
    ${notlar.length ? `<ul class="notlar">${notlar.map((n) => `<li>${kacis(n)}</li>`).join("")}</ul>` : ""}
    ${malzemeTablosu(t)}
    ${t.bolumler.map(adimlar).join("")}
    ${t.bolumler.map(cizelge).join("")}
  </article>`;
}

fetch("veri.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((v) => {
    document.getElementById("ana").innerHTML = v.tarifler.map(tarif).join("<hr>") || `<p class="bos">Henüz tarif yok.</p>`;
    if (v.tarifler.length === 1) document.title = `${v.tarifler[0].baslik} · Seyir Mutfak`;
  })
  .catch((h) => { document.getElementById("ana").innerHTML = `<p class="bos">veri okunamadı: ${kacis(h.message)}</p>`; });
</script>
</body>
</html>
